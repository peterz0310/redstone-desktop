name: RedstoneDesktop
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
targets:
  RedstoneDesktop:
    type: application
    platform: macOS
    sources:
      - RedstoneDesktop
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.redstonedesktop.RedstoneDesktop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RedstoneDesktop/Resources/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: RedstoneDesktop/Resources/RedstoneDesktop.entitlements
  RedstoneDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RedstoneDesktopTests
    dependencies:
      - target: RedstoneDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.redstonedesktop.RedstoneDesktopTests
schemes:
  RedstoneDesktop:
    build:
      targets:
        RedstoneDesktop: all
        RedstoneDesktopTests: [test]
    test:
      targets:
        - RedstoneDesktopTests
